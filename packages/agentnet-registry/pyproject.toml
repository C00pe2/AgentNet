[project]
name = "agentnet-registry"
version = "0.1.0"
description = "AgentNet registry: control plane (auth, recall, reputation) + gateway (data plane)"
requires-python = ">=3.12"
dependencies = [
    "agentnet-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentnet_registry"]
