[project]
name = "agentnet-mcp-server"
version = "0.1.0"
description = "Expose the AgentNet network as an MCP server (stdio)"
requires-python = ">=3.12"
dependencies = [
    "agentnet-core",
    "agentnet-router",
    "fastmcp>=2.8",
]

[project.scripts]
agentnet-mcp = "agentnet_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentnet_mcp_server"]
