[project]
name = "agentnet-cli"
version = "0.1.0"
description = "AgentNet command line interface"
requires-python = ">=3.12"
dependencies = [
    "agentnet-core",
    "agentnet-registry",
    "agentnet-router",
    "agentnet-sdk",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.scripts]
agentnet = "agentnet_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentnet_cli"]
